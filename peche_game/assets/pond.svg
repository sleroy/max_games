<svg xmlns="http://www.w3.org/2000/svg" width="800" height="500" viewBox="0 0 800 500" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#79bde6"/>
      <stop offset="0.6" stop-color="#bfe1f2"/>
      <stop offset="1" stop-color="#e9f6fb"/>
    </linearGradient>
    <linearGradient id="water" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#5fa0b6"/>
      <stop offset="0.25" stop-color="#3f7f97"/>
      <stop offset="1" stop-color="#173f52"/>
    </linearGradient>
    <linearGradient id="hillFar" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#8fbd86"/>
      <stop offset="1" stop-color="#6a9c6c"/>
    </linearGradient>
    <radialGradient id="sunGlow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#fff7cf" stop-opacity="0.95"/>
      <stop offset="0.45" stop-color="#ffe98a" stop-opacity="0.45"/>
      <stop offset="1" stop-color="#ffe98a" stop-opacity="0"/>
    </radialGradient>
    <filter id="blur4" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4"/>
    </filter>
    <filter id="blur10" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="10"/>
    </filter>
  </defs>

  <!-- Ciel -->
  <rect x="0" y="0" width="800" height="225" fill="url(#sky)"/>

  <!-- Soleil -->
  <circle cx="650" cy="62" r="95" fill="url(#sunGlow)"/>
  <circle cx="650" cy="62" r="24" fill="#fff4b8"/>

  <!-- Nuages -->
  <g fill="#ffffff" opacity="0.9">
    <ellipse cx="150" cy="58" rx="58" ry="18"/>
    <ellipse cx="188" cy="48" rx="42" ry="16"/>
    <ellipse cx="116" cy="50" rx="34" ry="13"/>
    <ellipse cx="430" cy="92" rx="66" ry="16"/>
    <ellipse cx="468" cy="84" rx="42" ry="13"/>
  </g>

  <!-- Collines lointaines -->
  <path d="M0,205 C110,158 210,178 310,168 C420,157 520,186 620,170 C700,158 760,176 800,168 L800,225 L0,225 Z" fill="url(#hillFar)" opacity="0.85"/>

  <!-- Masse d'arbres -->
  <path d="M0,225 L0,206 C60,192 120,202 180,194 C240,186 300,200 360,192 C420,184 480,198 540,190 C600,182 660,198 720,190 C760,185 785,194 800,190 L800,225 Z" fill="#3f7a4a"/>

  <!-- Canopée -->
  <g fill="#4f8f57">
    <circle cx="30" cy="202" r="18"/>
    <circle cx="70" cy="194" r="22"/>
    <circle cx="110" cy="200" r="17"/>
    <circle cx="150" cy="192" r="21"/>
    <circle cx="195" cy="199" r="18"/>
    <circle cx="235" cy="191" r="22"/>
    <circle cx="280" cy="198" r="17"/>
    <circle cx="320" cy="190" r="21"/>
    <circle cx="365" cy="197" r="18"/>
    <circle cx="405" cy="189" r="22"/>
    <circle cx="450" cy="196" r="17"/>
    <circle cx="490" cy="188" r="21"/>
    <circle cx="535" cy="195" r="18"/>
    <circle cx="575" cy="187" r="22"/>
    <circle cx="620" cy="194" r="17"/>
    <circle cx="660" cy="186" r="21"/>
    <circle cx="705" cy="193" r="18"/>
    <circle cx="745" cy="186" r="22"/>
    <circle cx="785" cy="192" r="17"/>
  </g>

  <!-- Eau -->
  <rect x="0" y="225" width="800" height="275" fill="url(#water)"/>

  <!-- Reflet du soleil sur l'eau -->
  <ellipse cx="650" cy="300" rx="60" ry="120" fill="#ffe98a" opacity="0.16" filter="url(#blur10)"/>

  <!-- Reflet des arbres (miroir autour de la ligne d'eau y=225) -->
  <g transform="translate(0,450) scale(1,-1)" opacity="0.22" filter="url(#blur4)">
    <path d="M0,225 L0,206 C60,192 120,202 180,194 C240,186 300,200 360,192 C420,184 480,198 540,190 C600,182 660,198 720,190 C760,185 785,194 800,190 L800,225 Z" fill="#2f5f45"/>
  </g>

  <!-- Ondulations -->
  <g stroke="#cfeaf3" stroke-width="2" fill="none" opacity="0.22" stroke-linecap="round">
    <path d="M60,270 q18,-6 36,0 t36,0"/>
    <path d="M300,255 q18,-6 36,0 t36,0"/>
    <path d="M520,285 q18,-6 36,0 t36,0"/>
    <path d="M120,330 q18,-6 36,0 t36,0"/>
    <path d="M420,350 q18,-6 36,0 t36,0"/>
    <path d="M640,380 q18,-6 36,0 t36,0"/>
    <path d="M200,420 q18,-6 36,0 t36,0"/>
    <path d="M500,450 q18,-6 36,0 t36,0"/>
  </g>

  <!-- Nénuphars -->
  <g>
    <ellipse cx="110" cy="430" rx="30" ry="11" fill="#3f7d4a"/>
    <ellipse cx="150" cy="455" rx="22" ry="8" fill="#4a8a52"/>
    <ellipse cx="690" cy="410" rx="26" ry="10" fill="#3f7d4a"/>
    <ellipse cx="730" cy="440" rx="18" ry="7" fill="#4a8a52"/>
  </g>

  <!-- Roseaux (premier plan) -->
  <g stroke="#2f6b3f" stroke-width="3" stroke-linecap="round" fill="none">
    <path d="M20,500 C24,460 18,430 26,400"/>
    <path d="M40,500 C44,465 38,440 46,415"/>
    <path d="M62,500 C66,470 60,445 68,420"/>
    <path d="M760,500 C756,462 762,435 754,405"/>
    <path d="M782,500 C778,468 784,442 776,418"/>
  </g>
  <g fill="#6b4a2b">
    <ellipse cx="26" cy="398" rx="4" ry="12"/>
    <ellipse cx="46" cy="413" rx="4" ry="11"/>
    <ellipse cx="68" cy="418" rx="4" ry="11"/>
    <ellipse cx="754" cy="403" rx="4" ry="12"/>
    <ellipse cx="776" cy="416" rx="4" ry="11"/>
  </g>
</svg>
