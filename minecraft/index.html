<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Minecraft en JavaScript</title>
    <style>
        body {
            margin: 0;
            overflow: hidden;
            background-color: #87CEEB; /* Sky blue */
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        #canvas-container {
            width: 100vw;
            height: 100vh;
            display: block;
        }

        #ui-layer {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            padding: 20px;
            box-sizing: border-box;
        }

        #crosshair {
            position: absolute;
            top: 50%;
            left: 50%;
            width: 20px;
            height: 20px;
            border: 2px solid rgba(255, 255, 255, 0.8);
            border-radius: 50%;
            transform: translate(-50%, -50%);
            pointer-events: none;
            z-index: 10;
        }

        #crosshair::after {
            content: '';
            position: absolute;
            top: 50%;
            left: 50%;
            width: 2px;
            height: 2px;
            background: white;
            transform: translate(-50%, -50%);
        }

        #hud {
            display: flex;
            justify-content: space-between;
            align-items: flex-end;
            width: 100%;
        }

        #inventory {
            background: rgba(0, 0, 0, 0.5);
            padding: 15px;
            border-radius: 10px;
            display: flex;
            gap: 10px;
            pointer-events: auto;
        }

        .inventory-slot {
            width: 50px;
            height: 50px;
            background: rgba(255, 255, 255, 0.1);
            border: 2px solid rgba(255, 255, 255, 0.3);
            border-radius: 5px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: all 0.2s;
        }

        .inventory-slot.active {
            border-color: #fff;
            background: rgba(255, 255, 255, 0.2);
            transform: scale(1.1);
        }

        .block-icon {
            width: 30px;
            height: 30px;
            border-radius: 3px;
        }

        #stats {
            color: white;
            text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.5);
            font-size: 18px;
            font-weight: bold;
        }

        #menu {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.8);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 100;
        }

        .menu-title {
            color: #fff;
            font-size: 4rem;
            text-transform: uppercase;
            margin-bottom: 40px;
            text-shadow: 4px 4px 8px rgba(0, 0, 0, 0.5);
        }

        .btn {
            background: #4CAF50;
            color: white;
            border: none;
            padding: 15px 40px;
            font-size: 1.5rem;
            border-radius: 50px;
            cursor: pointer;
            transition: all 0.3s;
            font-weight: bold;
            text-transform: uppercase;
            margin: 10px;
        }

        .btn:hover {
            background: #45a049;
            transform: scale(1.05);
        }

        .instructions {
            color: white;
            margin-top: 20px;
            font-size: 1.2rem;
            text-align: center;
            opacity: 0.8;
        }

        /* Crafting UI Styles */
        .crafting-container {
            background: rgba(0, 0, 0, 0.8);
            padding: 15px;
            border-radius: 10px;
            border: 2px solid #4CAF50;
            pointer-events: auto;
            text-align: center;
        }

        .crafting-progress {
            width: 100%;
            height: 20px;
            background: #333;
            border-radius: 10px;
            margin: 10px 0;
            overflow: hidden;
        }

        .progress-fill {
            width: 0%;
            height: 100%;
            background: #4CAF50;
            transition: width 0.1s;
        }

        .btn-craft {
            background: #2196F3;
            color: white;
            border: none;
            padding: 10px 20px;
            font-size: 1rem;
            border-radius: 5px;
            cursor: pointer;
            transition: all 0.2s;
            margin-top: 10px;
        }

        .btn-craft:hover {
            background: #1976D2;
            transform: scale(1.05);
        }

        .btn-craft:disabled {
            background: #666;
            cursor: not-allowed;
            transform: none;
        }
    </style>
</head>
<body>
    <div id="canvas-container"></div>
    
    <div id="ui-layer">
        <div id="crosshair"></div>
        
        <div id="hud">
            <div id="inventory">
                <div class="inventory-slot active" data-block="grass">
                    <div class="block-icon" style="background: #7CFC00; border: 2px solid #228B22;"></div>
                    <span style="font-size: 10px; color: white;">Herbe</span>
                </div>
                <div class="inventory-slot" data-block="dirt">
                    <div class="block-icon" style="background: #8B4513; border: 2px solid #5D4037;"></div>
                    <span style="font-size: 10px; color: white;">Terre</span>
                </div>
                <div class="inventory-slot" data-block="stone">
                    <div class="block-icon" style="background: #808080; border: 2px solid #696969;"></div>
                    <span style="font-size: 10px; color: white;">Pierre</span>
                </div>
                <div class="inventory-slot" data-block="wood">
                    <div class="block-icon" style="background: #D2691E; border: 2px solid #8B4513;"></div>
                    <span style="font-size: 10px; color: white;">Bois</span>
                </div>
            </div>
            
        <div id="stats">
            <div>Position: <span id="pos-x">0</span>, <span id="pos-y">0</span>, <span id="pos-z">0</span></div>
            <div>Blocs: <span id="block-count">0</span></div>
        </div>
        
        <!-- Barres de Survie (Mode Survie) -->
        <div id="survival-ui">
            <div class="health-container">
                <div class="label">Vie</div>
                <div class="health-bar">
                    <div class="health-fill" id="health-fill"></div>
                </div>
                <div class="health-text" id="health-text">20/20</div>
            </div>
            
            <div class="hunger-container">
                <div class="label">Faim</div>
                <div class="hunger-bar">
                    <div class="hunger-fill" id="hunger-fill"></div>
                </div>
                <div class="hunger-text" id="hunger-text">20/20</div>
            </div>
            
            <!-- Crafting Interface -->
            <div id="crafting-ui" style="display: none;">
                <div class="crafting-container">
                    <div class="label">Crafting</div>
                    <div class="crafting-progress">
                        <div class="progress-fill" id="craft-progress"></div>
                    </div>
                    <div class="crafting-text" id="craft-text">Prêt</div>
                    <button class="btn-craft" id="btn-craft">Craft</button>
                </div>
            </div>
        </div>
        </div>
    </div>

    <div id="menu">
        <h1 class="menu-title">Minecraft JS</h1>
        <button class="btn" id="start-btn">Commencer</button>
        <div class="instructions">
            <p>WASD pour se déplacer | Clic gauche pour casser | Clic droit pour placer</p>
            <p>1-4 pour changer de bloc | Espace pour sauter</p>
        </div>
    </div>

    <!-- Import Map pour Three.js -->
    <script type="importmap">
        {
            "imports": {
                "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
                "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
            }
        }
    </script>

    <script type="module" src="script.js"></script>
</body>
</html>
